site:
  title: "Research Paper Radar"
  subtitle: "计算机科学 · 计算生物学 · 每日研究信号"
  description: "每天从多个论文源聚合新工作，按你关注的研究方向筛选、排序并生成中文速读。"
  timezone: "Asia/Singapore"
  max_papers: 49
  per_category_limit: 7
  highlight_count: 8
  categories:
    - id: "bio-computing"
      name: "计算生物学"
      short: "BIO"
      description: "单细胞扰动、虚拟细胞、药物机制与调控网络"
      accent: "#177e75"
    - id: "large-language-models"
      name: "大语言模型"
      short: "LLM"
      description: "推理、智能体、对齐、RAG 与高效模型"
      accent: "#ef5d3f"
    - id: "knowledge-graphs"
      name: "知识图谱"
      short: "KG"
      description: "图谱构建、图推理、实体链接与 Graph RAG"
      accent: "#7b5bb5"
    - id: "reinforcement-learning"
      name: "强化学习"
      short: "RL"
      description: "离线强化学习、多智能体、奖励建模与策略优化"
      accent: "#d48727"
    - id: "continual-learning"
      name: "持续学习"
      short: "CL"
      description: "终身学习、增量学习、灾难性遗忘与持续预训练"
      accent: "#2574a9"
    - id: "pretraining"
      name: "预训练与基础模型"
      short: "PRE"
      description: "自监督学习、基础模型、表示学习与高效预训练"
      accent: "#2e8b57"
    - id: "multimodal-learning"
      name: "多模态学习"
      short: "MM"
      description: "视觉语言、音视频理解、跨模态生成与统一表征"
      accent: "#c04b78"

fetch:
  lookback_days: 4
  request_timeout_seconds: 30
  user_agent: "CellPaperRadar/1.0 (academic literature monitor)"
  sources:
    arxiv:
      enabled: true
      max_results: 400
      categories: ["q-bio.GN", "q-bio.QM", "q-bio.CB", "cs.AI", "cs.CL", "cs.LG", "cs.IR", "cs.CV", "cs.DB", "stat.ML"]
      queries:
        - "single cell perturbation"
        - "virtual cell"
        - "large language model"
        - "language model agent"
        - "knowledge graph"
        - "reinforcement learning"
        - "continual learning"
        - "foundation model"
        - "self-supervised learning"
        - "multimodal learning"
        - "vision language model"
    biorxiv:
      enabled: true
      max_results: 300
    pubmed:
      enabled: true
      max_results: 200
      email: ""
      topic_categories: ["bio-computing"]
    semantic_scholar:
      enabled: true
      max_results_per_query: 40
      queries:
        - "single cell perturbation prediction"
        - "virtual cell foundation model"
        - "gene regulatory network mechanism inference"
        - "large language model reasoning agent alignment"
        - "knowledge graph graph RAG reasoning"
        - "reinforcement learning offline multi agent"
        - "continual learning catastrophic forgetting"
        - "foundation model pretraining self supervised"
        - "multimodal vision language model"

