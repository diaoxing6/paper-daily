summary:
  enabled: true
  provider: "deepseek"
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  thinking_mode: "disabled"
  reasoning_effort: "low"
  max_papers: 49
  batch_size: 8
  language: "zh-CN"
